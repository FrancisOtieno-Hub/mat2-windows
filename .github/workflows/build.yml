name: Build mat2 for Windows

on:
  workflow_dispatch:
    inputs:
      mat2_ref:
        description: "mat2 commit, tag or branch to build (default: a pinned commit that includes Office-file fixes missing from release 0.15.0)"
        default: "5098533876135a7547b7a922ff408d749c29455e"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      MAT2_REF: ${{ inputs.mat2_ref || '5098533876135a7547b7a922ff408d749c29455e' }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git zip unzip curl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-cairo
            mingw-w64-x86_64-tk
            mingw-w64-x86_64-gdk-pixbuf2
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-poppler
            mingw-w64-x86_64-poppler-data
            mingw-w64-x86_64-fontconfig

      - name: Get mat2 source
        run: |
          git clone https://github.com/jvoisin/mat2.git mat2-src
          cd mat2-src && git checkout "$MAT2_REF"
          echo "MAT2_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAT2_VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install mutagen (pure Python)
        run: python -m pip install --break-system-packages --target build/pysite mutagen

      - name: Sanity check mat2 inside MSYS2 (before bundling)
        run: |
          cd mat2-src
          python mat2 --check-dependencies || true

      - name: Download ExifTool (Windows build)
        run: |
          VER=13.59
          EXPECTED=44b512b25af500724ba579d0a53c8fc5851628b692dd5e5d94ae4a15c2cba9ec
          echo "EXIFTOOL_VERSION=$VER" >> "$GITHUB_ENV"
          curl -fsSL -o exiftool.zip "https://sourceforge.net/projects/exiftool/files/exiftool-${VER}_64.zip/download"
          echo "${EXPECTED}  exiftool.zip" | sha256sum -c -
          unzip -q exiftool.zip -d build/exiftool-dl
          find build/exiftool-dl -maxdepth 2 | head -20
          EXE=$(find build/exiftool-dl -iname 'exiftool(-k).exe' | head -n1)
          DIR=$(dirname "$EXE")
          mkdir -p build/exiftool
          cp "$EXE" build/exiftool/exiftool.exe
          cp -r "$DIR/exiftool_files" build/exiftool/exiftool_files

      - name: Assemble portable bundle
        run: |
          bash scripts/bundle.sh dist/mat2-windows mat2-src build/pysite build/exiftool
          cp launcher/*.cmd dist/mat2-windows/
          cp tools/check_office.py dist/mat2-windows/app/check_office.py
          cp gui/mat2_gui.py dist/mat2-windows/app/mat2_gui.py
          cp README.md dist/mat2-windows/README.md
          mkdir -p dist/mat2-windows/THIRD-PARTY
          pacman -Q | grep -i mingw-w64 > dist/mat2-windows/THIRD-PARTY/packages.txt
          cp SOURCES.md dist/mat2-windows/THIRD-PARTY/SOURCES.md
          echo "mat2 commit: $MAT2_COMMIT" > dist/mat2-windows/THIRD-PARTY/BUILD-INFO.txt
          echo "ExifTool version: $EXIFTOOL_VERSION" >> dist/mat2-windows/THIRD-PARTY/BUILD-INFO.txt

      - name: Smoke test the bundle (plain Windows cmd, no MSYS2 on PATH)
        shell: cmd
        run: |
          dist\mat2-windows\mat2.cmd --check-dependencies
          dist\mat2-windows\mat2.cmd --version

      - name: Smoke test the window (loads Tcl/Tk, shows no window)
        shell: cmd
        continue-on-error: true  # a runner without a desktop must not block a release
        run: |
          dist\mat2-windows\Start-mat2-window.cmd --check

      - name: Zip and checksum
        run: |
          cd dist
          zip -qr "mat2-windows-${MAT2_VERSION}.zip" mat2-windows
          sha256sum "mat2-windows-${MAT2_VERSION}.zip" > "mat2-windows-${MAT2_VERSION}.zip.sha256"

      - name: Collect corresponding source code (GPL/LGPL compliance)
        run: |
          bash scripts/collect_sources.sh dist/mat2-windows dist/sources mat2-src build/pysite "$EXIFTOOL_VERSION"
          cd dist
          zip -0 -qr "mat2-windows-${MAT2_VERSION}-sources.zip" sources
          sha256sum "mat2-windows-${MAT2_VERSION}-sources.zip" > "mat2-windows-${MAT2_VERSION}-sources.zip.sha256"
          rm -rf sources

      - name: Write release notes
        run: |
          ZIP="mat2-windows-${MAT2_VERSION}.zip"
          SRC="mat2-windows-${MAT2_VERSION}-sources.zip"
          sed -e "s|__ZIP__|$ZIP|g" -e "s|__SOURCES_ZIP__|$SRC|g" \
              -e "s|__SHA256__|$(cut -d' ' -f1 dist/$ZIP.sha256)|g" \
              -e "s|__SOURCES_SHA256__|$(cut -d' ' -f1 dist/$SRC.sha256)|g" \
              -e "s|__MAT2_COMMIT__|$MAT2_COMMIT|g" -e "s|__EXIFTOOL__|$EXIFTOOL_VERSION|g" \
              RELEASE_TEMPLATE.md > dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: mat2-windows
          path: |
            dist/mat2-windows-*.zip
            dist/mat2-windows-*.zip.sha256
            dist/RELEASE_NOTES.md

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: mat2 for Windows ${{ github.ref_name }} (unofficial build)
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/mat2-windows-*.zip
            dist/mat2-windows-*.zip.sha256
